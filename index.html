<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>3D Zoo</title>
<style>
  :root { --ink:#111; --paper:#fff; --soft:#f2f2f2; --mid:#777; --line:#111; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); font:14px/1.4 "Courier New", ui-monospace, monospace; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; padding:6px 10px; border-bottom:3px solid var(--line); background:var(--paper); }
  header h1 { margin:0; font-size:22px; letter-spacing:3px; }
  header h1 small { font-size:10px; letter-spacing:1px; color:var(--mid); vertical-align:middle; }
  .stat { display:flex; flex-direction:column; line-height:1.1; }
  .stat small { font-size:10px; color:var(--mid); text-transform:uppercase; letter-spacing:1px; }
  .stat b { font-size:15px; }
  #money.neg { text-decoration:underline; }
  button.stat.click { border:none; background:none; padding:0; text-align:left; font:inherit; cursor:pointer; }
  button.stat.click b { text-decoration:underline dotted; text-underline-offset:3px; }
  button.stat.click:hover { background:var(--soft); }
  .legend { display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:12px; margin-top:6px; }
  .sw { display:inline-block; width:12px; height:12px; border:1.5px solid var(--ink); vertical-align:-2px; margin-right:4px; }
  .sw.solid { background:var(--ink); }
  .sw.hatch { background:repeating-linear-gradient(135deg, var(--ink) 0 1px, #fff 1px 4px); }
  table.fin { width:100%; border-collapse:collapse; font-size:12px; margin-bottom:6px; }
  table.fin td, table.fin th { padding:2px 4px; text-align:right; }
  table.fin td:first-child, table.fin th:first-child { text-align:left; }
  table.fin tr.sec td { font-weight:bold; padding-top:8px; border-bottom:1.5px solid var(--ink); }
  table.fin tr.tot td { font-weight:bold; border-top:1px solid var(--ink); }
  .bigrow { display:flex; gap:12px; align-items:center; margin-bottom:6px; }
  .big { font-size:40px; font-weight:bold; line-height:1; }
  .bar.empty { border-style:dashed; }
  #panel input { font:inherit; border:2px solid var(--ink); padding:4px 6px; width:160px; margin-top:6px; }
  .clock { width:60px; height:5px; border:1px solid var(--ink); margin-top:2px; }
  #clock { height:100%; background:var(--ink); }
  .spacer { flex:1; }
  button { font:inherit; color:var(--ink); background:var(--paper); border:2px solid var(--ink); padding:4px 9px; cursor:pointer; border-radius:0; }
  button:hover { background:var(--soft); }
  button.on { background:var(--ink); color:var(--paper); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #speed button { padding:3px 7px; min-width:34px; }
  #stage { position:relative; flex:1; min-height:0; }
  #world { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; cursor:crosshair; }
  #tools { background:var(--paper); position:relative; }
  #tabs { display:flex; gap:4px; padding:0 8px; position:relative; z-index:1; margin-bottom:-3px; }
  #tabs button { border-bottom:none; padding:3px 14px 4px; font-weight:bold; letter-spacing:1px; text-transform:uppercase; font-size:12px; background:var(--soft); }
  #tabs button.on { background:var(--paper); color:var(--ink); padding-bottom:7px; margin-top:-3px; }
  #tray { display:flex; align-items:stretch; gap:6px; padding:6px 8px; height:90px; border-top:3px solid var(--line); overflow-x:auto; overflow-y:hidden; }
  #tray .pane { display:none; gap:6px; align-items:stretch; }
  #tray .pane.on { display:flex; }
  #tray button { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:62px; padding:4px 6px; }
  #tray button small { font-size:10px; color:inherit; opacity:.8; }
  #tray .sep { width:2px; background:var(--ink); flex:0 0 2px; margin:0 2px; }
  #tray button.critter { min-width:84px; padding:2px 5px; line-height:1.15; }
  #tray button.critter canvas { display:block; background:#fff; border:1px solid var(--ink); margin-bottom:2px; }
  #tray button.critter.on canvas { border-color:var(--paper); }
  #tray button.hire { min-width:120px; }
  #tray .btop, #tray .bgrp { display:none; gap:6px; align-items:stretch; }
  #tray .pane[data-pane="build"]:not([data-folder]) .btop { display:flex; }
  #tray .pane[data-folder="fences"] .bgrp[data-group="fences"], #tray .pane[data-folder="trees"] .bgrp[data-group="trees"],
  #tray .pane[data-folder="water"] .bgrp[data-group="water"], #tray .pane[data-folder="toys"] .bgrp[data-group="toys"],
  #tray .pane[data-folder="buildings"] .bgrp[data-group="buildings"] { display:flex; }
  #tray button.grp { min-width:84px; }
  #tray button.grp small[data-grpnote] { max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #tray button.back { min-width:64px; border-style:dashed; }
  #tray .sexpick { display:flex; flex-direction:column; justify-content:center; gap:3px; flex:0 0 auto; }
  #tray .sexpick small { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--mid); text-align:center; }
  #tray .sexpick button { flex-direction:row; min-width:92px; padding:3px 6px; font-weight:bold; }
  #panel select { font:inherit; font-size:12px; border:2px solid var(--ink); background:var(--paper); color:var(--ink); padding:2px 4px; margin-top:4px; max-width:100%; }
  .staffrow select { display:block; width:100%; }
  #tray button.locked { border-style:dashed; color:var(--mid); background:var(--paper); }
  #tray button.locked canvas { opacity:.25; }
  #tray button.locked small:not(.lock) { display:none; }
  #tray button .lock { font-weight:bold; opacity:1; }
  .card.dim { border-style:dashed; color:var(--mid); }
  .staffrow { display:flex; align-items:center; gap:8px; border:2px solid var(--ink); padding:6px 8px; margin-bottom:6px; }
  .staffrow .who { flex:1; min-width:0; }
  .staffrow canvas { flex:0 0 auto; border:1.5px solid var(--ink); }
  .staffrow .who small { display:block; color:var(--mid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .staffrow button { margin:0; padding:3px 6px; font-size:12px; }
  .skill { letter-spacing:1px; }
  #panel.wide { width:400px; }
  .exhead { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:4px; }
  .exhead button { flex:0 0 auto; margin:0; padding:3px 8px; }
  .row .lbl { flex:0 0 82px; }
  .row .num { flex:0 0 24px; text-align:right; }
  #zoom { position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:4px; }
  #zoom button { width:34px; height:34px; padding:0; font-size:18px; font-weight:bold; }
  #newsbox { position:absolute; left:10px; bottom:10px; max-width:min(420px, 70%); font-size:12px; pointer-events:none; }
  #news-toggle { pointer-events:auto; font-size:11px; padding:1px 7px; background:rgba(255,255,255,.92); border-width:1.5px; }
  #news div { background:rgba(255,255,255,.92); border:1.5px solid var(--ink); padding:3px 7px; margin-top:4px; }
  #news div:not(:first-child) { opacity:.65; }
  #newsbox.min #news { display:none; }
  #toast { position:absolute; left:50%; top:12px; transform:translate(-50%, -8px); background:var(--ink); color:var(--paper); padding:6px 12px; opacity:0; transition:.2s; pointer-events:none; max-width:90%; text-align:center; }
  #toast.show { opacity:1; transform:translate(-50%, 0); }
  #tip { position:absolute; display:none; background:var(--paper); border:1.5px solid var(--ink); padding:2px 6px; font-size:12px; pointer-events:none; white-space:nowrap; }
  #panel { position:absolute; top:0; right:0; bottom:0; width:320px; max-width:100%; background:var(--paper); border-left:3px solid var(--line); display:none; flex-direction:column; }
  #panel.open { display:flex; }
  #panel .head { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-bottom:2px solid var(--line); }
  #panel .head h2 { margin:0; font-size:16px; }
  #panel-body { overflow-y:auto; padding:10px; }
  .card { border:2px solid var(--ink); padding:8px; margin-bottom:10px; }
  .card button { margin-top:6px; }
  .muted { color:var(--mid); font-size:12px; margin:0 0 10px; }
  .row { display:flex; align-items:center; gap:8px; margin:5px 0 2px; font-size:13px; }
  .bar { flex:1; height:9px; border:1.5px solid var(--ink); }
  .bar span { display:block; height:100%; background:var(--ink); }
  button.shop { display:flex; gap:8px; width:100%; text-align:left; margin-bottom:8px; padding:4px; align-items:center; }
  button.shop canvas { border:1.5px solid var(--ink); background:#fff; flex:0 0 auto; }
  button.shop.on canvas { border-color:var(--paper); }
  button.shop small { font-size:11px; }
  .help li { margin-bottom:8px; }
  .logline { margin-top:6px; font-size:12px; }
  .filebtn { display:inline-block; border:2px solid var(--ink); padding:4px 9px; margin-top:6px; cursor:pointer; }
  .filebtn input { display:none; }
  .short { display:none; }
  @media (max-width: 640px) {
    .short { display:inline; } .long { display:none; }
    header { gap:4px 10px; }
    .stat b { font-size:13px; }
    header h1 { font-size:18px; }
    #panel { top:auto; height:62%; width:100%; border-left:none; border-top:3px solid var(--line); }
    #newsbox { max-width:calc(100% - 70px); }
    #tray button { min-width:54px; padding:4px 5px; }
    #tray button.grp { min-width:70px; }
    #tray button[data-tool="look"] small { display:none; }
  }
  /* winning the game: big gold letters and confetti */
  #victory { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.72); }
  #victory.show { display:flex; }
  #confetti { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; }
  #victory .card-win { position:relative; text-align:center; padding:24px 22px; max-width:min(640px, calc(100% - 32px)); background:rgba(17,17,17,.9); border:4px solid #d4a017; box-shadow:0 0 40px rgba(245,197,24,.45); color:#fff; }
  #victory h2 { margin:0; font-size:clamp(20px, 6.2vw, 56px); line-height:1.05; letter-spacing:2px; white-space:nowrap; font-weight:900;
    background:linear-gradient(100deg, #8a6d0b 0%, #f5c518 22%, #fff3b0 38%, #f5c518 52%, #b8860b 72%, #ffe066 100%); background-size:220% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 0 #5c4500); animation:shine 3s linear infinite, pop .7s cubic-bezier(.2,1.6,.4,1) both; }
  #victory .won { margin:10px 0 6px; font-size:clamp(20px, 5vw, 34px); font-weight:bold; letter-spacing:4px; color:#ffdf5e; }
  #victory .stars { font-size:clamp(20px, 5vw, 32px); color:#f5c518; letter-spacing:4px; }
  #victory p { margin:12px 0 18px; font-size:14px; color:#eee; }
  #victory-go { font:inherit; font-weight:bold; font-size:16px; padding:8px 18px; background:#f5c518; color:#111; border:2px solid #fff3b0; cursor:pointer; }
  #victory-go:hover { background:#ffe066; }
  @keyframes shine { to { background-position:-220% 0; } }
  @keyframes pop { from { transform:scale(.3); opacity:0; } to { transform:scale(1); opacity:1; } }
  @media (prefers-reduced-motion: reduce) { #victory h2 { animation:none; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>3D ZOO <small id="ver" title="Game version">v1.14</small></h1>
    <button class="stat click" id="s-money" title="See income and costs"><small>Money</small><b id="money">$0</b></button>
    <div class="stat"><small id="day">Day 1</small><div class="clock"><div id="clock"></div></div></div>
    <div class="stat"><small>Guests</small><b id="guests">0</b></div>
    <button class="stat click" id="s-stars" title="See your next star goal"><small>Zoo stars</small><b id="stars">★☆☆☆☆</b></button>
    <button class="stat click" id="s-rating" title="See what affects your rating"><small>Rating</small><b id="rating">50</b></button>
    <div class="stat"><small>Ticket</small><b id="ticket">$15</b></div>
    <div class="spacer"></div>
    <div id="speed">
      <button data-speed="0" title="Pause (space)">||</button><button data-speed="1" title="Normal speed">&gt;</button><button data-speed="2" title="Fast">&gt;&gt;</button><button data-speed="3" title="Fastest">&gt;&gt;&gt;</button>
    </div>
    <button id="b-menu">Menu</button>
    <button id="b-help"><span class="long">How to play</span><span class="short">?</span></button>
  </header>
  <div id="stage">
    <canvas id="world"></canvas>
    <div id="newsbox"><button id="news-toggle" aria-expanded="true" title="Show or hide the news">News ▾</button><div id="news"></div></div>
    <div id="zoom"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button></div>
    <div id="tip"></div>
    <div id="toast"></div>
    <aside id="panel">
      <div class="head"><h2 id="panel-title"></h2><button id="panel-close" aria-label="Close">X</button></div>
      <div id="panel-body"></div>
    </aside>
  </div>
  <nav id="tools">
    <div id="tabs">
      <button data-tab="build">Build</button>
      <button data-tab="animals">Animals</button>
      <button data-tab="staff">Staff</button>
      <button data-tab="exhibits">Exhibits</button>
    </div>
    <div id="tray">
      <button data-tool="look">Look<small>move, inspect</small></button>
      <span class="sep"></span>
      <div class="pane" data-pane="build">
        <!-- top level: the most used tools, plus folders that open into the rest -->
        <div class="btop">
          <button data-tool="path">Path<small>$10</small></button>
          <button class="grp" data-open="fences" title="Fence and aviary mesh">Fences ▸<small data-grpnote="fences">2 kinds</small></button>
          <button class="grp" data-open="trees" title="Trees and bushes">Trees ▸<small data-grpnote="trees">5 kinds</small></button>
          <button class="grp" data-open="water" title="Pond, swim pool, tank water, and snow"><span class="long">Water &amp; snow ▸</span><span class="short">Water ▸</span><small data-grpnote="water">4 kinds</small></button>
          <button class="grp" data-open="toys" title="Toys for land animals and for the tank">Toys ▸<small data-grpnote="toys">8 kinds</small></button>
          <button class="grp" data-open="buildings" title="Gift shop and education center">Buildings ▸<small data-grpnote="buildings">2 kinds</small></button>
          <span class="sep"></span>
          <button data-tool="remove">Remove<small>bulldoze</small></button>
        </div>
        <div class="bgrp" data-group="fences">
          <button class="back" data-back title="Back to all build tools">‹ Back<small>Fences</small></button>
          <button data-tool="fence">Fence<small>$25</small></button>
          <button data-tool="mesh" title="Aviary mesh: close an exhibit in with it for birds that fly">Aviary mesh<small>$40</small></button>
        </div>
        <div class="bgrp" data-group="trees">
          <button class="back" data-back title="Back to all build tools">‹ Back<small>Trees</small></button>
          <button data-tool="tree">Oak<small>$150</small></button>
          <button data-tool="acacia">Acacia<small>$170</small></button>
          <button data-tool="palm">Palm<small>$180</small></button>
          <button data-tool="pine">Pine<small>$160</small></button>
          <button data-tool="bush">Bush<small>$60</small></button>
        </div>
        <div class="bgrp" data-group="water">
          <button class="back" data-back title="Back to all build tools">‹ Back<small>Water &amp; snow</small></button>
          <button data-tool="water" title="Pond: counts as water for the animals">Pond<small>$200</small></button>
          <button data-tool="pool" title="Swim pool: water inside an exhibit for animals that love to swim">Swim pool<small>$60/tile</small></button>
          <button data-tool="tank" title="Tank water: at least 12 tiles inside a fence make an aquarium">Tank water<small>$150/tile</small></button>
          <button data-tool="snow" title="Snow: cover half an exhibit's land for cold animals">Snow<small>$40/tile</small></button>
        </div>
        <div class="bgrp" data-group="toys">
          <button class="back" data-back title="Back to all build tools">‹ Back<small>Toys</small></button>
          <button data-tool="toy">Ball<small>$120</small></button>
          <button data-tool="wheel">Wheel<small>$300</small></button>
          <button data-tool="post">Scratch post<small>$90</small></button>
          <button data-tool="climb" title="Climbing frame: monkeys love to climb it">Climbing frame<small>$350</small></button>
          <button data-tool="perch" title="Perch: a branch for birds to sit on">Perch<small>$110</small></button>
          <span class="sep"></span>
          <button data-tool="buoy" title="Floating buoy: goes in tank water. Orcas push it around">Buoy<small>$400</small></button>
          <button data-tool="bubbler" title="Bubble curtain: goes in tank water. Sharks swim through it">Bubble curtain<small>$600</small></button>
          <button data-tool="hoop" title="Floating hoop: goes in tank water. Dolphins leap through it">Hoop<small>$300</small></button>
        </div>
        <div class="bgrp" data-group="buildings">
          <button class="back" data-back title="Back to all build tools">‹ Back<small>Buildings</small></button>
          <button data-tool="gift">Gift shop<small>$2,500</small></button>
          <button data-tool="edu">Education<small>$4,000</small></button>
        </div>
      </div>
      <div class="pane" data-pane="animals"></div>
      <div class="pane" data-pane="staff"></div>
      <div class="pane" data-pane="exhibits"></div>
    </div>
  </nav>
</div>
<div id="victory" role="dialog" aria-modal="true" aria-labelledby="victory-title">
  <canvas id="confetti"></canvas>
  <div class="card-win">
    <h2 id="victory-title">CONGRATULATIONS!</h2>
    <div class="won">YOU WON!</div>
    <div class="stars">★★★★★★★★</div>
    <p id="victory-stats"></p>
    <button id="victory-go">Keep playing</button>
  </div>
</div>
<script src="animals.js?v=1.14"></script>
<script src="world-art.js?v=1.14"></script>
<script src="game.js?v=1.14"></script>
</body>
</html>
