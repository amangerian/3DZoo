<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>3D Zoo</title>
<style>
  :root { --ink:#111; --paper:#fff; --soft:#f2f2f2; --mid:#777; --line:#111; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); font:14px/1.4 "Courier New", ui-monospace, monospace; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100%; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; padding:6px 10px; border-bottom:3px solid var(--line); background:var(--paper); }
  header h1 { margin:0; font-size:22px; letter-spacing:3px; }
  .stat { display:flex; flex-direction:column; line-height:1.1; }
  .stat small { font-size:10px; color:var(--mid); text-transform:uppercase; letter-spacing:1px; }
  .stat b { font-size:15px; }
  #money.neg { text-decoration:underline; }
  .clock { width:60px; height:5px; border:1px solid var(--ink); margin-top:2px; }
  #clock { height:100%; background:var(--ink); }
  .spacer { flex:1; }
  button { font:inherit; color:var(--ink); background:var(--paper); border:2px solid var(--ink); padding:4px 9px; cursor:pointer; border-radius:0; }
  button:hover { background:var(--soft); }
  button.on { background:var(--ink); color:var(--paper); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #speed button { padding:3px 7px; min-width:34px; }
  #stage { position:relative; flex:1; min-height:0; }
  #world { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; cursor:crosshair; }
  #tools { display:flex; gap:6px; padding:6px 8px; border-top:3px solid var(--line); overflow-x:auto; background:var(--paper); }
  #tools button { flex:0 0 auto; display:flex; flex-direction:column; align-items:center; min-width:62px; padding:4px 6px; }
  #tools button small { font-size:10px; color:inherit; opacity:.8; }
  #tools .sep { width:2px; background:var(--ink); flex:0 0 2px; margin:0 2px; }
  #zoom { position:absolute; right:10px; bottom:10px; display:flex; flex-direction:column; gap:4px; }
  #zoom button { width:34px; height:34px; padding:0; font-size:18px; font-weight:bold; }
  #news { position:absolute; left:10px; bottom:10px; max-width:min(420px, 70%); font-size:12px; pointer-events:none; }
  #news div { background:rgba(255,255,255,.92); border:1.5px solid var(--ink); padding:3px 7px; margin-top:4px; }
  #news div:not(:first-child) { opacity:.65; }
  #toast { position:absolute; left:50%; top:12px; transform:translate(-50%, -8px); background:var(--ink); color:var(--paper); padding:6px 12px; opacity:0; transition:.2s; pointer-events:none; max-width:90%; text-align:center; }
  #toast.show { opacity:1; transform:translate(-50%, 0); }
  #tip { position:absolute; display:none; background:var(--paper); border:1.5px solid var(--ink); padding:2px 6px; font-size:12px; pointer-events:none; white-space:nowrap; }
  #panel { position:absolute; top:0; right:0; bottom:0; width:320px; max-width:100%; background:var(--paper); border-left:3px solid var(--line); display:none; flex-direction:column; }
  #panel.open { display:flex; }
  #panel .head { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-bottom:2px solid var(--line); }
  #panel .head h2 { margin:0; font-size:16px; }
  #panel-body { overflow-y:auto; padding:10px; }
  .card { border:2px solid var(--ink); padding:8px; margin-bottom:10px; }
  .card button { margin-top:6px; }
  .muted { color:var(--mid); font-size:12px; margin:0 0 10px; }
  .row { display:flex; align-items:center; gap:8px; margin:5px 0 2px; font-size:13px; }
  .bar { flex:1; height:9px; border:1.5px solid var(--ink); }
  .bar span { display:block; height:100%; background:var(--ink); }
  button.shop { display:flex; gap:8px; width:100%; text-align:left; margin-bottom:8px; padding:4px; align-items:center; }
  button.shop canvas { border:1.5px solid var(--ink); background:#fff; flex:0 0 auto; }
  button.shop.on canvas { border-color:var(--paper); }
  button.shop small { font-size:11px; }
  .help li { margin-bottom:8px; }
  .logline { margin-top:6px; font-size:12px; }
  .filebtn { display:inline-block; border:2px solid var(--ink); padding:4px 9px; margin-top:6px; cursor:pointer; }
  .filebtn input { display:none; }
  .short { display:none; }
  @media (max-width: 640px) {
    .short { display:inline; } .long { display:none; }
    header { gap:4px 10px; }
    .stat b { font-size:13px; }
    header h1 { font-size:18px; }
    #panel { top:auto; height:62%; width:100%; border-left:none; border-top:3px solid var(--line); }
    #news { display:none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>3D ZOO</h1>
    <div class="stat"><small>Money</small><b id="money">$0</b></div>
    <div class="stat"><small id="day">Day 1</small><div class="clock"><div id="clock"></div></div></div>
    <div class="stat"><small>Guests</small><b id="guests">0</b></div>
    <div class="stat"><small>Rating</small><b id="rating">50</b></div>
    <div class="stat"><small>Ticket</small><b id="ticket">$15</b></div>
    <div class="spacer"></div>
    <div id="speed">
      <button data-speed="0" title="Pause (space)">||</button><button data-speed="1" title="Normal speed">&gt;</button><button data-speed="2" title="Fast">&gt;&gt;</button><button data-speed="3" title="Fastest">&gt;&gt;&gt;</button>
    </div>
    <button id="b-menu">Menu</button>
    <button id="b-help"><span class="long">How to play</span><span class="short">?</span></button>
  </header>
  <div id="stage">
    <canvas id="world"></canvas>
    <div id="news"></div>
    <div id="zoom"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button></div>
    <div id="tip"></div>
    <div id="toast"></div>
    <aside id="panel">
      <div class="head"><h2 id="panel-title"></h2><button id="panel-close" aria-label="Close">X</button></div>
      <div id="panel-body"></div>
    </aside>
  </div>
  <nav id="tools">
    <button data-tool="look">Look<small>move, inspect</small></button>
    <span class="sep"></span>
    <button data-tool="path">Path<small>$10</small></button>
    <button data-tool="fence">Fence<small>$25</small></button>
    <button data-tool="tree">Tree<small>$150</small></button>
    <button data-tool="bush">Bush<small>$60</small></button>
    <button data-tool="water">Water<small>$200</small></button>
    <button data-tool="toy">Toy<small>$120</small></button>
    <span class="sep"></span>
    <button data-tool="animal">Animals<small>buy</small></button>
    <button id="b-staff">Staff<small>hire</small></button>
    <span class="sep"></span>
    <button data-tool="remove">Remove<small>bulldoze</small></button>
  </nav>
</div>
<script src="js/animals.js"></script>
<script src="js/world-art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
